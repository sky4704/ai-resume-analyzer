{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Reset Password</h2>

        <p class="sub-text">
            Enter your new password
        </p>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="New password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
